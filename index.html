<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#1D9E75" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fish Dryer" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <title>Fish Dryer v3.0</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap");
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        --teal: #1d9e75;
        --teal-l: #e1f5ee;
        --teal-d: #085041;
        --amber: #ba7517;
        --amber-l: #faeeda;
        --amber-d: #633806;
        --red: #e24b4a;
        --red-l: #fcebeb;
        --green: #3b6d11;
        --green-l: #eaf3de;
        --blue: #185fa5;
        --blue-l: #e6f1fb;
        --purple: #6b3fa0;
        --purple-l: #f0eaf9;
        --bg: #f5f5f0;
        --surf: #ffffff;
        --surf2: #f9f9f7;
        --bdr: rgba(0, 0, 0, 0.09);
        --bdr2: rgba(0, 0, 0, 0.16);
        --t1: #1a1a1a;
        --t2: #555;
        --t3: #888;
        --r: 12px;
        --rsm: 8px;
        --rp: 20px;
        --f: "DM Sans", sans-serif;
      }
      .dark {
        --bg: #111;
        --surf: #1c1c1e;
        --surf2: #2c2c2e;
        --bdr: rgba(255, 255, 255, 0.08);
        --bdr2: rgba(255, 255, 255, 0.15);
        --t1: #f5f5f5;
        --t2: #aaa;
        --t3: #666;
        --teal-l: rgba(29, 158, 117, 0.15);
        --teal-d: #4ecfa0;
        --amber-l: rgba(186, 117, 23, 0.15);
        --amber-d: #f0b94a;
        --red-l: rgba(226, 75, 74, 0.15);
        --green-l: rgba(59, 109, 17, 0.15);
        --blue-l: rgba(24, 95, 165, 0.15);
        --purple-l: rgba(107, 63, 160, 0.15);
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: var(--f);
        background: var(--bg);
        color: var(--t1);
      }
      #app {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        max-width: 430px;
        margin: 0 auto;
        background: var(--bg);
      }
      .hdr {
        background: var(--surf);
        border-bottom: 0.5px solid var(--bdr);
        padding: 11px 14px 9px;
        flex-shrink: 0;
      }
      .hdr-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .app-name {
        font-size: 17px;
        font-weight: 600;
        color: var(--t1);
      }
      .app-ver {
        font-size: 10px;
        color: var(--t3);
        font-weight: 400;
      }
      .app-date {
        font-size: 11px;
        color: var(--t3);
        margin-top: 1px;
      }
      .hdr-btns {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--bdr2);
        background: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--t2);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sync-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-family: var(--f);
        font-weight: 500;
        border: 1px solid var(--bdr2);
        border-radius: var(--rp);
        padding: 4px 10px;
        background: none;
        cursor: pointer;
        color: var(--t2);
      }
      .sync-btn.synced {
        color: var(--teal);
        border-color: var(--teal);
        background: var(--teal-l);
      }
      .sync-btn.syncing {
        color: var(--amber);
        border-color: var(--amber);
      }
      .sync-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex-shrink: 0;
      }
      .update-banner {
        background: var(--blue);
        color: #fff;
        padding: 10px 14px;
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-shrink: 0;
      }
      .update-banner.show {
        display: flex;
      }
      .update-banner span {
        font-size: 13px;
        font-weight: 500;
      }
      .update-banner button {
        font-size: 12px;
        font-family: var(--f);
        font-weight: 600;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        border-radius: var(--rp);
        padding: 5px 12px;
        cursor: pointer;
        color: #fff;
      }
      .nav {
        display: flex;
        background: var(--surf);
        border-top: 0.5px solid var(--bdr);
        flex-shrink: 0;
        order: 10;
        min-height: 56px;
      }
      .nb {
        flex: 1;
        border: none;
        background: none;
        cursor: pointer;
        padding: 6px 2px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 9px;
        font-family: var(--f);
        color: var(--t3);
        position: relative;
      }
      .nb svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nb.active {
        color: var(--teal);
      }
      .nb.active svg {
        stroke-width: 2.2;
      }
      .nb-badge {
        position: absolute;
        top: 3px;
        right: calc(50% - 17px);
        background: var(--red);
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        padding: 1px 4px;
        border-radius: 10px;
        line-height: 1.4;
      }
      .content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 12px;
      }
      .screen {
        display: none;
      }
      .screen.active {
        display: block;
      }
      .card {
        background: var(--surf);
        border-radius: var(--r);
        border: 0.5px solid var(--bdr);
        padding: 13px 15px;
        margin-bottom: 10px;
      }
      .card-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--t3);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 11px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .card-title svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }
      .stat {
        background: var(--surf);
        border-radius: var(--r);
        border: 0.5px solid var(--bdr);
        padding: 10px 12px;
      }
      .stat-label {
        font-size: 10px;
        color: var(--t3);
        font-weight: 500;
      }
      .stat-val {
        font-size: 18px;
        font-weight: 600;
        margin-top: 2px;
      }
      .ct {
        color: var(--teal);
      }
      .cr {
        color: var(--red);
      }
      .ca {
        color: var(--amber);
      }
      .cp {
        color: var(--purple);
      }
      .fg {
        margin-bottom: 10px;
      }
      .fl {
        font-size: 12px;
        font-weight: 500;
        color: var(--t2);
        display: block;
        margin-bottom: 4px;
      }
      .fi {
        width: 100%;
        font-size: 14px;
        font-family: var(--f);
        padding: 9px 11px;
        border: 1px solid var(--bdr2);
        border-radius: var(--rsm);
        background: var(--surf);
        color: var(--t1);
        outline: none;
        transition: border-color 0.15s;
        -webkit-appearance: none;
      }
      .fi:focus {
        border-color: var(--teal);
      }
      .irow {
        display: flex;
        gap: 8px;
      }
      .irow .fi {
        flex: 1;
      }
      .cb {
        padding: 9px 11px;
        border: 1px solid var(--bdr2);
        border-radius: var(--rsm);
        background: var(--teal-l);
        cursor: pointer;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }
      .cb svg {
        width: 17px;
        height: 17px;
        stroke: var(--teal);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .r2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .total-box {
        background: var(--teal-l);
        border: 1px solid rgba(29, 158, 117, 0.25);
        border-radius: var(--rsm);
        padding: 9px 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .total-label {
        font-size: 12px;
        color: var(--teal-d);
        font-weight: 500;
      }
      .total-amt {
        font-size: 19px;
        font-weight: 700;
        color: var(--teal);
      }
      .fish-rows {
        margin-bottom: 10px;
      }
      .fish-row {
        background: var(--surf2);
        border: 1px solid var(--bdr2);
        border-radius: var(--rsm);
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .fish-row-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .fish-row-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--teal);
      }
      .fish-row-del {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--red);
        display: flex;
        align-items: center;
      }
      .fish-row-del svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fish-row-total {
        font-size: 11px;
        color: var(--t3);
        margin-top: 6px;
        text-align: right;
      }
      .add-fish-btn {
        width: 100%;
        padding: 9px;
        border: 1.5px dashed var(--bdr2);
        border-radius: var(--rsm);
        background: none;
        font-size: 13px;
        font-family: var(--f);
        font-weight: 500;
        cursor: pointer;
        color: var(--t2);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .add-fish-btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 11px;
        border-radius: var(--rsm);
        font-size: 14px;
        font-family: var(--f);
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--bdr2);
        background: var(--surf);
        color: var(--t1);
        transition: all 0.15s;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.primary {
        background: var(--teal);
        color: #fff;
        border-color: var(--teal);
      }
      .btn.danger {
        background: var(--red-l);
        color: var(--red);
        border-color: var(--red);
      }
      .btn.whatsapp {
        background: #25d366;
        color: #fff;
        border-color: #25d366;
      }
      .btn.sm {
        padding: 6px 11px;
        font-size: 12px;
        width: auto;
        border-radius: var(--rp);
      }
      .btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .pill {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: var(--rp);
        display: inline-block;
      }
      .pill.fresh {
        background: var(--blue-l);
        color: var(--blue);
      }
      .pill.drying {
        background: var(--amber-l);
        color: var(--amber-d);
      }
      .pill.ready {
        background: var(--teal-l);
        color: var(--teal-d);
      }
      .pill.collected {
        background: var(--surf2);
        color: var(--t2);
      }
      .pill.paid {
        background: var(--green-l);
        color: var(--green);
      }
      .pill.partial {
        background: var(--amber-l);
        color: var(--amber-d);
      }
      .pill.debt {
        background: var(--red-l);
        color: var(--red);
      }
      .pill.cash {
        background: var(--green-l);
        color: var(--green);
      }
      .pill.credit {
        background: var(--amber-l);
        color: var(--amber-d);
      }
      .itr {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 0.5px solid var(--bdr);
        cursor: pointer;
      }
      .itr:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .itr:first-child {
        padding-top: 0;
      }
      .itr-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--t1);
      }
      .itr-meta {
        font-size: 11px;
        color: var(--t3);
        margin-top: 2px;
        line-height: 1.5;
      }
      .itr-right {
        text-align: right;
        flex-shrink: 0;
        margin-left: 10px;
      }
      .itr-amt {
        font-size: 13px;
        font-weight: 600;
        color: var(--t1);
      }
      .abar {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--amber-l);
        border: 0.5px solid rgba(186, 117, 23, 0.3);
        border-radius: var(--r);
        padding: 10px 13px;
        margin-bottom: 10px;
      }
      .abar svg {
        width: 17px;
        height: 17px;
        stroke: var(--amber);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .abar-text {
        font-size: 12px;
        color: var(--amber-d);
        font-weight: 500;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 11px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        padding: 6px 12px;
        border: 1px solid var(--bdr2);
        border-radius: var(--rp);
        background: var(--surf);
        font-size: 12px;
        font-family: var(--f);
        font-weight: 500;
        cursor: pointer;
        color: var(--t2);
        white-space: nowrap;
      }
      .tab.active {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      .mbg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 50;
        align-items: flex-end;
        justify-content: center;
      }
      .mbg.open {
        display: flex;
      }
      .modal {
        background: var(--surf);
        border-radius: var(--r) var(--r) 0 0;
        padding: 16px 15px 28px;
        width: 100%;
        max-width: 430px;
        max-height: 88dvh;
        overflow-y: auto;
      }
      .mhandle {
        width: 34px;
        height: 4px;
        background: var(--bdr2);
        border-radius: 2px;
        margin: 0 auto 13px;
      }
      .mtitle {
        font-size: 16px;
        font-weight: 700;
        color: var(--t1);
        margin-bottom: 2px;
      }
      .msub {
        font-size: 12px;
        color: var(--t3);
        margin-bottom: 12px;
      }
      .mclose {
        float: right;
        background: none;
        border: 1px solid var(--bdr);
        border-radius: var(--rp);
        font-size: 12px;
        font-family: var(--f);
        cursor: pointer;
        color: var(--t3);
        padding: 2px 10px;
      }
      .dtbl {
        width: 100%;
        font-size: 13px;
        border-collapse: collapse;
      }
      .dtbl td {
        padding: 7px 0;
        border-bottom: 0.5px solid var(--bdr);
      }
      .dtbl tr:last-child td {
        border-bottom: none;
      }
      .dtbl .dl {
        color: var(--t3);
        font-weight: 500;
        width: 42%;
      }
      .dtbl .dv {
        text-align: right;
        font-weight: 500;
      }
      .dvdr {
        height: 0.5px;
        background: var(--bdr);
        margin: 12px 0;
      }
      .pay-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 0;
        border-bottom: 0.5px solid var(--bdr);
      }
      .pay-row:last-child {
        border-bottom: none;
      }
      .pay-amt {
        font-size: 14px;
        font-weight: 700;
        color: var(--green);
      }
      .pay-meta {
        font-size: 11px;
        color: var(--t3);
      }
      .bal-box {
        border-radius: var(--rsm);
        padding: 9px 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 9px 0;
        background: var(--red-l);
        border: 1px solid rgba(226, 75, 74, 0.2);
      }
      .bal-box.clear {
        background: var(--green-l);
        border-color: rgba(59, 109, 17, 0.2);
      }
      .cust-card {
        background: var(--surf);
        border-radius: var(--r);
        border: 0.5px solid var(--bdr);
        padding: 13px 15px;
        margin-bottom: 9px;
        cursor: pointer;
      }
      .cust-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--t1);
      }
      .cust-meta {
        font-size: 11px;
        color: var(--t3);
        margin-top: 2px;
      }
      .cust-stats {
        display: flex;
        gap: 7px;
        margin-top: 9px;
        flex-wrap: wrap;
      }
      .cst {
        background: var(--bg);
        border-radius: var(--rsm);
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 500;
        color: var(--t2);
      }
      .bar-wrap {
        margin-bottom: 10px;
      }
      .bar-label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 4px;
      }
      .bar-label span:first-child {
        font-weight: 600;
        color: var(--t1);
      }
      .bar-label span:last-child {
        color: var(--t3);
      }
      .bar-track {
        background: var(--bg);
        border-radius: 4px;
        height: 10px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 4px;
        background: var(--teal);
        transition: width 0.5s;
      }
      .sum-period {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .sum-card {
        background: var(--surf);
        border-radius: var(--r);
        border: 0.5px solid var(--bdr);
        padding: 13px 15px;
        margin-bottom: 8px;
      }
      .sum-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 0.5px solid var(--bdr);
        font-size: 13px;
      }
      .sum-row:last-child {
        border-bottom: none;
      }
      .sum-row .sl {
        color: var(--t2);
      }
      .sum-row .sv {
        font-weight: 600;
      }
      .search-wrap {
        position: relative;
        margin-bottom: 11px;
      }
      .search-wrap svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 15px;
        height: 15px;
        stroke: var(--t3);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .search-input {
        width: 100%;
        padding: 8px 11px 8px 32px;
        border: 1px solid var(--bdr2);
        border-radius: var(--r);
        font-size: 13px;
        font-family: var(--f);
        background: var(--surf);
        color: var(--t1);
        outline: none;
      }
      .search-input:focus {
        border-color: var(--teal);
      }
      .cfm {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .cfm.open {
        display: flex;
      }
      .cfm-box {
        background: var(--surf);
        border-radius: var(--r);
        padding: 18px;
        width: 100%;
        max-width: 300px;

      const DRIVE_FILE_NAME = "fishdryer-data.json";
      const SCOPES = "https://www.googleapis.com/auth/drive.appdata";
      let gToken = null,
        gFileId = null,
        syncTmr = null,
        isSyncing = false,
        gTokenClient = null,
        gTokenExpiry = 0,
        silentSignInTimer = null;

      let state = {
        items: [],
        nextId: 1,
        shop: {
          purchases: [],
          purNextId: 1,
          expenses: [],
          expNextId: 1,
          sales: [],
          saleNextId: 1,
          dryStockKg: 0,
          pricePerKg: 17000,
        },
      };
      let userName = "",
        darkMode = false,
        fishRowCount = 0;

      function lsave() {
        try {
          localStorage.setItem("fishdryer_v4", JSON.stringify(state));
        } catch (e) {}
      }
      function lload() {
        try {
          const d = localStorage.getItem("fishdryer_v4");
          if (d) state = JSON.parse(d);
          if (!state.shop)
            state.shop = {
              purchases: [],
              purNextId: 1,
              expenses: [],
              expNextId: 1,
              sales: [],
              saleNextId: 1,
              dryStockKg: 0,
              pricePerKg: 17000,
            };
          ["purchases", "expenses", "sales"].forEach((k) => {
            if (!state.shop[k]) state.shop[k] = [];
          });
          if (!state.shop.pricePerKg) state.shop.pricePerKg = 17000;
          if (!state.shop.purNextId) state.shop.purNextId = 1;
          if (!state.shop.expNextId) state.shop.expNextId = 1;
          if (!state.shop.saleNextId) state.shop.saleNextId = 1;
        } catch (e) {}
      }
      lload();

      window.addEventListener("online", () => {
        if (localStorage.getItem("fd_gsignin") === "1" && !isTokenValid()) {
          setSyncStatus("syncing", "Signing in...");
          signInGoogle(true);
        }
      });

      window.addEventListener("offline", () => {
        setSyncStatus("", "Offline");
      });

      // ─── BACK BUTTON HANDLER ───────────────────────────────────────────────────
      window.addEventListener("popstate", handleBackButton);

      function pushState() {
        history.pushState({ page: true }, "");

        ];

        for (const m of modals) {
          const el = document.getElementById(m.id);
          if (el && el.classList.contains("open")) {
            m.fn();
            pushState(); // push again so next back still works

        // no modal open — go back to home if not already there
        const activeScreen = document.querySelector(".screen.active");
        if (activeScreen && activeScreen.id !== "screen-home") {
          showScreen("home");

          return;

        history.back();

      function calcVisitTotal() {
        let g = 0;
        document.querySelectorAll(".fish-row").forEach((el) => {

            parseFloat(document.getElementById("fr-weight-" + id)?.value) || 0;

            parseFloat(document.getElementById("fr-price-" + id)?.value) || 0;
          const d =
            parseFloat(document.getElementById("fr-disc-" + id)?.value) || 0;
          const t = Math.max(0, w * p - d);

          const tel = document.getElementById("fr-total-" + id);

      async function pullLatestFromDrive() {
        if (!gToken) return;
        try {
          if (!gFileId) {
            const l = await gFetch(
              `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${DRIVE_FILE_NAME}'&fields=files(id)`,
            );
            if (l.files?.length) gFileId = l.files[0].id;
          }
          if (gFileId) {
            const r = await gFetch(
              `https://www.googleapis.com/drive/v3/files/${gFileId}?alt=media`,
            );
            mergeRemote(r);
            renderHome();
            lsave();
          }
        } catch (e) {
          console.log("Pull failed", e);
        }
      }
      function signInGoogle(silent = false) {
        if (!window.google) {
          if (!silent) showToast("Loading Google... try again");
          setTimeout(() => signInGoogle(silent), 1000);
          return;
        }
        if (!gTokenClient) {
          gTokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: SCOPES,
            callback: async (r) => {
              clearTimeout(silentSignInTimer);
              if (r.error) {
                if (!silent) showToast("Sign in failed");
                setSyncStatus("", "Sign in");
                return;
              }
              gToken = r.access_token;
              gTokenExpiry = Date.now() + (r.expires_in - 60) * 1000;
              localStorage.setItem("fd_gsignin", "1");
              setSyncStatus("syncing", "Syncing...");
              await pullLatestFromDrive();
              await syncNow();
              scheduleTokenRefresh(r.expires_in - 60);
            },
          });
        }
        if (silent)
          silentSignInTimer = setTimeout(
            () => setSyncStatus("", "Sign in"),
            5000,
          );
        gTokenClient.requestAccessToken({
          prompt: silent ? "" : "select_account",
        });
      }
      function signOut() {
        gToken = null;
        gFileId = null;
        gTokenExpiry = 0;
        gTokenClient = null;
        localStorage.removeItem("fd_gsignin");
        setSyncStatus("", "Sign in");
        showToast("Signed out");
      }
      function scheduleTokenRefresh(sec) {
        setTimeout(
          () => {
            if (localStorage.getItem("fd_gsignin") === "1")
              gTokenClient?.requestAccessToken({ prompt: "" });
          },
          Math.max(0, sec * 1000),
        );
      }
      function isTokenValid() {
        return gToken && Date.now() < gTokenExpiry;
      }
      async function syncNow() {
        if (!gToken || isSyncing) return;
        isSyncing = true;
        setSyncStatus("syncing", "Syncing...");
        try {
          if (!gFileId) {
            const l = await gFetch(
              `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${DRIVE_FILE_NAME}'&fields=files(id)`,
            );
            if (l.files?.length) gFileId = l.files[0].id;
          }
          if (gFileId) {
            const r = await gFetch(
              `https://www.googleapis.com/drive/v3/files/${gFileId}?alt=media`,
            );
            mergeRemote(r);
            renderHome();
          }
          const body = JSON.stringify(state);
          if (gFileId) {
            await gFetchRaw(
              `https://www.googleapis.com/upload/drive/v3/files/${gFileId}?uploadType=media`,
              {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body,
              },
            );
          } else {
            const m = await gFetch(
              "https://www.googleapis.com/drive/v3/files",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  name: DRIVE_FILE_NAME,
                  parents: ["appDataFolder"],
                }),
              },
            );
            gFileId = m.id;
            await gFetchRaw(
              `https://www.googleapis.com/upload/drive/v3/files/${gFileId}?uploadType=media`,
              {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body,
              },
            );
          }
          lsave();
          setSyncStatus("synced", "Synced ✓");
          renderHome();
        } catch (e) {
          console.error(e);
          setSyncStatus("", "Retry sync");
          showToast("Sync failed — check connection");
        }
        isSyncing = false;
      }
      function mergeRemote(remote) {
        if (!remote?.items) return;
        const map = {};
        state.items.forEach((i) => (map[i.id] = i));
        remote.items.forEach((ri) => {
          if (!map[ri.id]) state.items.push(ri);
          else {
            const le = new Date(map[ri.id].editedAt || map[ri.id].createdAt),
              re = new Date(ri.editedAt || ri.createdAt);
            if (re > le) Object.assign(map[ri.id], ri);
          }
        });
        if (remote.nextId > state.nextId) state.nextId = remote.nextId;
        state.items.sort(
          (a, b) => new Date(b.createdAt) - new Date(a.createdAt),
        );
        if (remote.shop) {
          ["purchases", "expenses", "sales"].forEach((k) => {
            if (remote.shop[k]) {
              const lm = {};
              (state.shop[k] || []).forEach((x) => (lm[x.id] = x));
              remote.shop[k].forEach((x) => {
                if (!lm[x.id]) state.shop[k].push(x);
                else {
                  const le = new Date(lm[x.id].editedAt || lm[x.id].date || 0),
                    re = new Date(x.editedAt || x.date || 0);
                  if (re > le) Object.assign(lm[x.id], x);
                }
              });
              state.shop[k].sort((a, b) => new Date(b.date) - new Date(a.date));
            }
          });
          if (remote.shop.pricePerKg)
            state.shop.pricePerKg = remote.shop.pricePerKg;
          recalcDryStock();
        }
      }
      function gFetch(url, opts = {}) {
        opts.headers = Object.assign(
          {
            Authorization: "Bearer " + gToken,
            "Content-Type": "application/json",
          },
          opts.headers || {},
        );
        return fetch(url, opts).then((r) => r.json());
      }
      function gFetchRaw(url, opts = {}) {
        opts.headers = Object.assign(
          { Authorization: "Bearer " + gToken },
          opts.headers || {},
        );
        return fetch(url, opts);
      }
      function scheduleSync() {
        if (!localStorage.getItem("fd_gsignin")) return;
        clearTimeout(syncTmr);
        syncTmr = setTimeout(async () => {
          if (!isTokenValid()) {
            gTokenClient?.requestAccessToken({ prompt: "" });
            return;
          }
          syncNow();
        }, 3000);
      }

      const fmt = (n) => "₦" + Math.round(n).toLocaleString("en-NG");
      const fmtKg = (n) => (n % 1 === 0 ? n + "kg" : +n.toFixed(2) + "kg");
      const statusLabel = (s) =>
        ({
          fresh: "In stock",
          drying: "Drying",
          ready: "Ready",
          collected: "Collected",
        })[s] || s;
      function timeAgo(iso) {
        const s = (Date.now() - new Date(iso)) / 1000;
        if (s < 60) return "just now";
        if (s < 3600) return Math.floor(s / 60) + "m ago";
        if (s < 86400) return Math.floor(s / 3600) + "h ago";
        return Math.floor(s / 86400) + "d ago";
      }
      function shortDate(iso) {
        return new Date(iso).toLocaleDateString("en-NG", {

      function totalPaid(item) {
        return (item.payments || []).reduce((a, p) => a + p.amount, 0);
      }
      function balance(item) {
        return Math.max(0, item.total - totalPaid(item));
      }
      function payStatus(item) {
        if (item.status !== "collected") return null;
        const p = totalPaid(item);
        if (p <= 0) return "debt";
        if (p >= item.total || item.settledShort) return "paid";
        return "partial";
      }
      function payLabel(item) {
        return (
          { paid: "Paid", partial: "Part paid", debt: "Unpaid" }[
            payStatus(item)
          ] || ""
        );
      }
      function recalcDryStock() {
        const bought = state.shop.purchases.reduce(
          (a, p) => a + (p.actualDryKg || p.estimatedDryKg || 0),
          0,
        );
        const sold = state.shop.sales.reduce((a, s) => a + s.weightKg, 0);
        state.shop.dryStockKg = Math.max(0, +(bought - sold).toFixed(2));
      }

        document.getElementById("screen-" + name)?.classList.add("active");
        const idx = NAV_SCREENS.indexOf(name);
        if (idx >= 0)
          document.querySelectorAll(".nb")[idx]?.classList.add("active");
        ({
          home: renderHome,
          inventory: () => renderInventory("all"),
          customers: renderCustomers,
          debts: () => renderDebts("all"),
          summary: () => renderSummary("week"),
          analytics: renderAnalytics,
          shop: () => renderShopTab("overview"),
          settings: renderSettings,
        })[name]?.();
        pushState();
      }
      function showMoreMenu() {
        document.getElementById("more-bg").classList.add("open");
      }
      function closeMore() {
        document.getElementById("more-bg").classList.remove("open");
      }

      function saveItem() {
        const editId = document.getElementById("edit-id").value;
        const name = document
          .getElementById("in-name")
          .value.trim()
          .replace(/\b\w/g, (c) => c.toUpperCase());
        const phone = document.getElementById("in-phone").value.trim();
        const status = document.getElementById("in-status").value;
        const notes = document.getElementById("in-notes").value.trim();
        if (!name) {
          showToast("Please enter the customer name");
          return;
        }
        const fishRows = getFishRows();
        if (!fishRows.length) {
          showToast("Please add at least one fish type");
          return;
        }
        const total = fishRows.reduce((a, r) => a + r.total, 0);
        if (editId) {
          const item = state.items.find((x) => x.id == editId);
          if (item)
            Object.assign(item, {
              name,
              phone,
              fishRows,
              total,
              notes,
              status,
              editedAt: new Date().toISOString(),
            });
          showToast("✓ Record updated");
          cancelEdit();
          showScreen("inventory");
        } else {
          state.items.unshift({
            id: state.nextId++,
            name,
            phone,
            fishRows,
            total,
            notes,
            status,
            addedBy: userName,
            payments: [],
            settledShort: false,
            createdAt: new Date(
              document.getElementById("in-date").value || Date.now(),
            ).toISOString(),
            collectedAt: null,
            editedAt: null,
          });
          showToast("✓ Intake saved for " + name);
          clearForm();
          showScreen("inventory");
        }
        lsave();
        scheduleSync();
      }
      function clearForm() {
        ["in-name", "in-phone", "in-notes"].forEach(
          (id) => (document.getElementById(id).value = ""),
        );
        document.getElementById("in-status").value = "drying";
        document.getElementById("edit-id").value = "";
        document.getElementById("in-date").value = new Date()
          .toISOString()
          .split("T")[0];
        initFishRows();
      }
      function startEdit(id) {
        const i = state.items.find((x) => x.id === id);
        if (!i) return;
        closeModal();
        document.getElementById("edit-id").value = id;
        document.getElementById("in-name").value = i.name;
        document.getElementById("in-phone").value = i.phone || "";
        document.getElementById("in-status").value = i.status || "drying";
        document.getElementById("in-date").value = i.createdAt
          ? i.createdAt.split("T")[0]
          : new Date().toISOString().split("T")[0];
        document.getElementById("in-notes").value = i.notes || "";
        fishRowCount = 0;
        document.getElementById("fish-rows").innerHTML = "";
        (
          i.fishRows || [
            {
              type: i.type,
              weight: i.weight,
              count: i.count,
              price: i.price,
              discount: i.discount,
              total: i.total,
            },
          ]
        ).forEach((fr) => {
          addFishRow();
          const rid = fishRowCount;
          document.getElementById("fr-type-" + rid).value = fr.type || "";
          document.getElementById("fr-weight-" + rid).value = fr.weight || "";
          document.getElementById("fr-count-" + rid).value = fr.count || "";
          document.getElementById("fr-price-" + rid).value = fr.price || "";
          document.getElementById("fr-disc-" + rid).value = fr.discount || "";
        });
        calcVisitTotal();
        document.getElementById("form-title").textContent = "Edit record";
        document.getElementById("save-lbl").textContent = "Save changes";
        document.getElementById("cancel-btn").style.display = "";
        showScreen("intake");
      }
      function cancelEdit() {
        clearForm();
        document.getElementById("form-title").textContent = "New intake";
        document.getElementById("save-lbl").textContent = "Save intake";
        document.getElementById("cancel-btn").style.display = "none";
      }

      function confirmDelete(id, type = "service") {
        document.getElementById("cfm-title").textContent = "Delete record?";
        document.getElementById("cfm-msg").textContent =
          "This will permanently remove this record.";
        document.getElementById("cfm-ok").textContent = "Delete";
        document.getElementById("cfm-ok").onclick = () => {
          if (type === "service")
            state.items = state.items.filter((x) => x.id !== id);
          else if (type === "purchase")
            state.shop.purchases = state.shop.purchases.filter(
              (x) => x.id !== id,
            );
          else if (type === "expense")
            state.shop.expenses = state.shop.expenses.filter(
              (x) => x.id !== id,
            );
          else if (type === "sale") {
            state.shop.sales = state.shop.sales.filter((x) => x.id !== id);
            recalcDryStock();
          }
          lsave();
          scheduleSync();
          closeModal();
          closeCfm();
          showToast("Record deleted");
          renderHome();
        };
        document.getElementById("cfm").classList.add("open");
      }
      function closeCfm() {
        document.getElementById("cfm").classList.remove("open");
      }
      function renderHome() {
        recalcDryStock();
        const drying = state.items.filter((i) => i.status === "drying").length;
        const ready = state.items.filter((i) => i.status === "ready").length;
        const serviceDebt = state.items
          .filter((i) => i.status === "collected" && !i.settledShort)
          .reduce((a, i) => a + balance(i), 0);

          .filter((s) => s.type === "credit" && !s.paid)
          .reduce((a, s) => a + (s.amount - s.amtPaid), 0);
        const youOwe = state.shop.purchases
          .filter((p) => p.paymentType === "credit" && !p.paid)
          .reduce((a, p) => a + (p.totalCost - p.amtPaid), 0);
        document.getElementById("s-dry").textContent = drying;
        document.getElementById("s-stock").textContent = fmtKg(
          state.shop.dryStockKg,
        );
        document.getElementById("s-owedto").textContent = fmt(
          serviceDebt + salesDebt,
        );
        document.getElementById("s-youowe").textContent = fmt(youOwe);
        const debtCount =
          state.items.filter(
            (i) =>

          ah += `<div class="abar" style="background:var(--teal-l);border-color:rgba(29,158,117,.25)"><svg viewBox="0 0 24 24" style="stroke:var(--teal)"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg><div class="abar-text" style="color:var(--teal-d)">${ready} item${ready > 1 ? "s" : ""} ready — notify customers</div></div>`;
        if (state.shop.dryStockKg > 0 && state.shop.dryStockKg <= 2)
          ah += `<div class="abar" style="background:var(--red-l);border-color:rgba(226,75,74,.3)"><svg viewBox="0 0 24 24" style="stroke:var(--red)"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg><div class="abar-text" style="color:var(--red)">Low stock — only ${fmtKg(state.shop.dryStockKg)} dry fish left</div></div>`;

            _type: "purchase",

          })),
          ...state.shop.sales.map((s) => ({
            ...s,
            _type: "sale",

          return;

        recent.innerHTML = all

            if (r._type === "service") {

              return `<div class="itr" onclick="openItem(${r.id})"><div><div class="itr-name">${r.name}</div><div class="itr-meta">${fish} · ${timeAgo(r._date)}</div><div class="itr-meta"><span class="pill ${r.status}">${statusLabel(r.status)}</span>${ps ? ' <span class="pill ' + ps + '">' + payLabel(r) + "</span>" : ""}</div></div><div class="itr-right"><div class="itr-amt">${fmt(r.total)}</div></div></div>`;

        el.innerHTML = `<div class="card"><div class="card-title">Record fish purchase</div>

  <input class="fi" id="buy-supplier" type="text" placeholder="e.g. Joy" autocomplete="off" oninput="showSupplierSuggestions()" onblur="setTimeout(hideSupplierSuggestions,200)">

</div></div>
  <div class="fg"><label class="fl">Supplier phone</label>
  <div class="irow">
    <input class="fi" id="buy-phone" type="tel" placeholder="e.g. 08012345678">
    <button class="cb" onclick="pickBuyContact()" title="Pick from contacts"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></button>

</div>
  <div class="r2"><div class="fg"><label class="fl">Fresh weight (kg) *</label><input class="fi" id="buy-freshkg" type="number" placeholder="0.0" step="0.1" min="0" inputmode="decimal" oninput="calcBuyEst()"></div><div class="fg"><label class="fl">Price per kg (₦) *</label><input class="fi" id="buy-pricepkg" type="number" placeholder="0" min="0" inputmode="numeric" oninput="calcBuyEst()"></div></div>

  <div class="fg"><label class="fl">Actual dry weight (fill after drying)</label><input class="fi" id="buy-dryact" type="number" placeholder="Leave empty until dried" step="0.1" min="0" inputmode="decimal"></div>
  <div class="fg"><label class="fl">Payment type</label><select class="fi" id="buy-paytype" onchange="toggleBuyCredit()"><option value="cash">Cash — paid fully</option><option value="credit">Credit — pay later</option></select></div>
  <div id="buy-credit-section" style="display:none"><div class="fg"><label class="fl">Amount paid now (₦)</label><input class="fi" id="buy-amtpaid" type="number" placeholder="0" min="0" inputmode="numeric"></div></div>
  <div class="fg"><label class="fl">Date</label><input class="fi" id="buy-date" type="date"></div>
  <div class="fg"><label class="fl">Notes</label><input class="fi" id="buy-notes" type="text" placeholder="Optional..."></div>
  <button class="btn primary" onclick="savePurchase()"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>Save purchase</button></div>
  <div class="slabel">All purchases</div><div id="purchases-list"></div>`;
        document.getElementById("buy-date").value = new Date()
          .toISOString()
          .split("T")[0];
        renderPurchasesList();
      }
      function calcBuyEst() {
        const kg =
          parseFloat(document.getElementById("buy-freshkg")?.value) || 0;
        const p =
          parseFloat(document.getElementById("buy-pricepkg")?.value) || 0;
        if (document.getElementById("buy-total")) {
          document.getElementById("buy-total").textContent = fmt(kg * p);
        }
        const estEl = document.getElementById("buy-dryest");
        if (estEl) {
          estEl.value = kg ? +(kg * 0.35).toFixed(2) : "";
        }
      }
      function toggleBuyCredit() {
        const t = document.getElementById("buy-paytype")?.value;
        const s = document.getElementById("buy-credit-section");
        if (s) s.style.display = t === "credit" ? "block" : "none";
      }
      function savePurchase() {
        const supplier = document
          .getElementById("buy-supplier")
          .value.trim()
          .replace(/\b\w/g, (c) => c.toUpperCase());
        const phone = document.getElementById("buy-phone").value.trim();
        const freshKg =
          parseFloat(document.getElementById("buy-freshkg").value) || 0;
        const pricePerKg =
          parseFloat(document.getElementById("buy-pricepkg").value) || 0;
        const dryEst =
          parseFloat(document.getElementById("buy-dryest").value) ||
          +(freshKg * 0.35).toFixed(2);
        const dryAct =
          parseFloat(document.getElementById("buy-dryact").value) || 0;
        const payType = document.getElementById("buy-paytype").value;
        const amtPaid =
          payType === "credit"
            ? parseFloat(document.getElementById("buy-amtpaid")?.value) || 0
            : freshKg * pricePerKg;
        const date =
          document.getElementById("buy-date").value ||
          new Date().toISOString().split("T")[0];
        const notes = document.getElementById("buy-notes").value.trim();
        if (!supplier) {
          showToast("Enter supplier name");
          return;
        }
        if (!freshKg || !pricePerKg) {
          showToast("Enter weight and price");
          return;
        }
        const totalCost = freshKg * pricePerKg;
        state.shop.purchases.unshift({
          id: state.shop.purNextId++,
          supplierName: supplier,
          phone,
          freshKg,
          pricePerKg,
          totalCost,
          estimatedDryKg: dryEst,
          actualDryKg: dryAct || null,
          paymentType: payType,
          amtPaid,
          paid: payType === "cash" || amtPaid >= totalCost,
          date: new Date(date).toISOString(),
          notes,
          addedBy: userName,
          payments:
            payType === "credit" && amtPaid > 0
              ? [{ amount: amtPaid, date: new Date().toISOString() }]
              : [],
        });
        recalcDryStock();
        lsave();
        scheduleSync();
        showToast("✓ Purchase saved");
        [
          "buy-supplier",
          "buy-phone",
          "buy-freshkg",
          "buy-pricepkg",
          "buy-dryest",
          "buy-dryact",
          "buy-amtpaid",
          "buy-notes",
        ].forEach((id) => {
          const e = document.getElementById(id);
          if (e) e.value = "";
        });
        document.getElementById("buy-paytype").value = "cash";
        document.getElementById("buy-credit-section").style.display = "none";
        document.getElementById("buy-total").textContent = "₦0";
        document.getElementById("buy-date").value = new Date()
          .toISOString()
          .split("T")[0];
        renderPurchasesList();
      }
      function renderPurchasesList() {
        const el = document.getElementById("purchases-list");
        if (!el) return;
        if (!state.shop.purchases.length) {

      function renderProfit(el) {
        const now = new Date();
        const ms = new Date(now.getFullYear(), now.getMonth(), 1);
        const lms = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const lme = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59);
        function calc(s, e) {
          const sales = state.shop.sales.filter(
            (x) => new Date(x.date) >= s && new Date(x.date) <= e,
          );
          const purch = state.shop.purchases.filter(
            (x) => new Date(x.date) >= s && new Date(x.date) <= e,
          );
          const exp = state.shop.expenses.filter(
            (x) => new Date(x.date) >= s && new Date(x.date) <= e,
          );
          const rev = sales.reduce((a, x) => a + x.amount, 0);
          const cost = purch.reduce((a, x) => a + x.totalCost, 0);
          const expCost = exp.reduce((a, x) => a + x.amount, 0);
          return { rev, cost, expCost, profit: rev - cost - expCost };
        }
        const tm = calc(ms, now);
        const lm = calc(lms, lme);
        const at = calc(new Date(0), now);
        function pCard(label, d) {
          const pos = d.profit >= 0;
          return `<div class="profit-box ${pos ? "positive" : "negative"}"><div class="profit-label" style="color:${pos ? "var(--green)" : "var(--red)"}">${label}</div><div class="profit-val" style="color:${pos ? "var(--green)" : "var(--red)"}">${d.profit < 0 ? "-" : ""}${fmt(Math.abs(d.profit))}</div><div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap"><div style="font-size:12px"><span style="color:var(--t3)">Sales</span><br><strong style="color:var(--green)">${fmt(d.rev)}</strong></div><div style="font-size:12px"><span style="color:var(--t3)">Fish cost</span><br><strong style="color:var(--red)">-${fmt(d.cost)}</strong></div><div style="font-size:12px"><span style="color:var(--t3)">Expenses</span><br><strong style="color:var(--purple,#6B3FA0)">-${fmt(d.expCost)}</strong></div></div></div>`;
        }
        el.innerHTML =
          pCard(
            "This month — " +
              now.toLocaleDateString("en-NG", {
                month: "long",
                year: "numeric",
              }),
            tm,
          ) +
          pCard(
            "Last month — " +
              lms.toLocaleDateString("en-NG", {
                month: "long",
                year: "numeric",
              }),
            lm,
          ) +
          pCard("All time", at) +
          `<div class="card"><div class="card-title">Expense breakdown</div>${
            ["Salt", "Charcoal", "Labour", "Transport", "Other"]
              .map((t) => {
                const tot = state.shop.expenses
                  .filter((e) => e.type === t)
                  .reduce((a, e) => a + e.amount, 0);
                return tot > 0
                  ? `<div class="sum-row"><span class="sl">${t}</span><span class="sv" style="color:var(--purple,#6B3FA0)">${fmt(tot)}</span></div>`
                  : "";
              })
              .join("") ||
            "<div class='itr-meta' style='padding:8px 0'>No expenses yet</div>"
          }</div>`;
      }

      function recordSalePayment(id, settle) {
        const s = state.shop.sales.find((x) => x.id === id);

        const amt =
          parseFloat(document.getElementById("sale-pay-amt")?.value) || 0;
        if (!amt) {
          showToast("Enter amount");
          return;
        }
        s.amtPaid += amt;
        if (!s.payments) s.payments = [];
        s.payments.push({ amount: amt, date: new Date().toISOString() });
        if (settle || s.amtPaid >= s.amount) s.paid = true;
        s.editedAt = new Date().toISOString();
        lsave();
        scheduleSync();
        closePayModal();
        closeModal();
        showToast("✓ Payment recorded");
        renderHome();

      let currentSumPeriod = "week";

      function renderSummary(period) {
        currentSumPeriod = period;
        const now = new Date();
        let start,
          end = new Date(now),
          label;
        if (period === "week") {
          start = new Date(now);
          start.setDate(now.getDate() - now.getDay());
          start.setHours(0, 0, 0, 0);
          label = "This week";
        } else if (period === "month") {
          start = new Date(now.getFullYear(), now.getMonth(), 1);
          label = now.toLocaleDateString("en-NG", {
            month: "long",
            year: "numeric",
          });
        } else {
          start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          end = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59);
          label = new Date(start).toLocaleDateString("en-NG", {
            month: "long",
            year: "numeric",
          });
        }
        const items = state.items.filter((i) => {
          const d = new Date(i.createdAt);
          return d >= start && d <= end;
        });
        const sales = state.shop.sales.filter((s) => {
          const d = new Date(s.date);
          return d >= start && d <= end;
        });
        const purchases = state.shop.purchases.filter((p) => {
          const d = new Date(p.date);
          return d >= start && d <= end;
        });
        const expenses = state.shop.expenses.filter((e) => {
          const d = new Date(e.date);
          return d >= start && d <= end;
        });
        const collected = items.filter((i) => i.status === "collected");

        const salesRev = sales.reduce((a, s) => a + s.amount, 0);
        const buyingCost = purchases.reduce((a, p) => a + p.totalCost, 0);

        el.innerHTML = `<div class="sum-card">

    <div class="slabel">Drying service</div>
    <div class="sum-row"><span class="sl">Intakes</span><span class="sv">${items.length}</span></div>
    <div class="sum-row"><span class="sl">Revenue collected</span><span class="sv ct">${fmt(serviceRev)}</span></div>
    <div class="sum-row"><span class="sl">Still drying</span><span class="sv ca">${items.filter((i) => i.status === "drying").length}</span></div>

    <div class="slabel" style="margin-top:12px">Shop (buy & sell)</div>

    <div class="sum-row"><span class="sl">Fish bought (cost)</span><span class="sv cr">-${fmt(buyingCost)}</span></div>
    <div class="sum-row"><span class="sl">Expenses</span><span class="sv" style="color:var(--purple,#6B3FA0)">-${fmt(expCost)}</span></div>
    <div class="sum-row" style="border-top:1px solid var(--bdr2);margin-top:4px;padding-top:10px"><span class="sl" style="font-weight:600">Shop profit</span><span class="sv" style="color:${salesRev - buyingCost - expCost >= 0 ? "var(--green)" : "var(--red)"};font-size:16px">${fmt(salesRev - buyingCost - expCost)}</span></div>
  </div>`;
      }

          document.getElementById("cust-search").value || ""
        ).toLowerCase();

              name: i.name,
              phone: i.phone || "",

              totalBiz: 0,
              totalPaidAmt: 0,
              totalBal: 0,
            };

          map[k].totalBiz += i.total;
          map[k].totalPaidAmt += totalPaid(i);
          if (i.status === "collected" && !i.settledShort)
            map[k].totalBal += balance(i);

            map[key] = {

              totalBal: 0,

  <div class="slabel">All visits</div>${items
