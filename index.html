    ${i.payments?.length ? `<div class="slabel">Payments</div>${i.payments.map((p) => `<div class="pay-row"><div><div class="pay-amt">${fmt(p.amount)}</div><div class="pay-meta">${shortDate(p.date)}${p.note ? " · " + p.note : ""}</div></div></div>`).join("")}<div class="bal-box ${bal <= 0 || i.settledShort ? "clear" : ""}"><span style="font-size:12px;font-weight:600;color:${bal <= 0 || i.settledShort ? "var(--green)" : "var(--red)"}">${bal <= 0 || i.settledShort ? "Fully settled ✓" : "Remaining balance"}</span><span style="font-size:16px;font-weight:700;color:${bal <= 0 || i.settledShort ? "var(--green)" : "var(--red)"}">${i.settledShort ? "Settled" : fmt(bal)}</span></div>` : ""}
    <div class="dvdr"></div>
    ${getActions(i)}
    <div class="dvdr"></div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      ${
        i.status === "fresh" || i.status === "drying" || i.status === "ready"
          ? `<button class="btn" style="flex:1" onclick="closeModal();showAcknowledgement(${i.id})">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line></svg>
        Acknowledgement
      </button>`
          : `<button class="btn" style="flex:1" onclick="closeModal();showReceipt(${i.id})">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        Receipt
      </button>`
      }
      <button class="btn" style="flex:1" onclick="startEdit(${i.id})"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>Edit</button>
    </div>
    <button class="btn danger" onclick="confirmDelete(${i.id},'service')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14H6L5 6"></path></svg>Delete</button>`;
        document.getElementById("modal-bg").classList.add("open");
      }

      function getActions(i) {
        let h = "";
        if (i.status === "fresh")
          h += `<button class="btn" style="margin-bottom:8px" onclick="changeStatus(${i.id},'drying')">🔥 Start drying</button>`;
        if (i.status === "drying")
          h += `<button class="btn primary" style="margin-bottom:8px" onclick="changeStatus(${i.id},'ready')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>Mark as ready to collect</button>`;
        if (i.status === "ready") {
          h += `<button class="btn primary" style="margin-bottom:8px" onclick="changeStatus(${i.id},'collected')"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>Mark as collected</button>`;
          if (i.phone)
            h += `<button class="btn whatsapp" style="margin-bottom:8px" onclick="sendWhatsApp('${i.phone}','${i.name}','ready',${i.id})"><svg viewBox="0 0 24 24" style="fill:none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>WhatsApp — fish ready</button>`;
        }
        if (i.status === "collected" && !i.settledShort && balance(i) > 0) {
          h += `<button class="btn primary" style="margin-bottom:8px" onclick="openPayModal(${i.id})"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>Record payment</button>`;
          if (i.phone)
            h += `<button class="btn whatsapp" style="margin-bottom:8px" onclick="sendWhatsApp('${i.phone}','${i.name}','debt',${i.id})"><svg viewBox="0 0 24 24" style="fill:none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>WhatsApp — remind payment</button>`;
        }
        return h;
      }

      function changeStatus(id, ns) {
        const i = state.items.find((x) => x.id === id);
        if (!i) return;
        i.status = ns;
        if (ns === "collected") i.collectedAt = new Date().toISOString();
        i.editedAt = new Date().toISOString();
        lsave();
        scheduleSync();
        closeModal();
        showToast("Updated: " + statusLabel(ns));
        renderHome();
      }

      function openPayModal(id) {
        const i = state.items.find((x) => x.id === id);
        if (!i) return;
        const bal = balance(i);
        const paid = totalPaid(i);
        document.getElementById("pay-body").innerHTML = `
    <button class="mclose" onclick="closePayModal()">Close</button>
    <div class="mtitle">Record payment</div><div class="msub">${i.name} — ${fmt(i.total)} total</div>
    <table class="dtbl" style="margin-bottom:11px">
      ${paid > 0 ? `<tr><td class="dl">Already paid</td><td class="dv" style="color:var(--green)">${fmt(paid)}</td></tr>` : ""}
      <tr><td class="dl" style="font-weight:600">Balance owed</td><td class="dv" style="font-weight:700;color:var(--red)">${fmt(bal)}</td></tr>
    </table>
    <div class="fg"><label class="fl">Amount received (₦) *</label><input class="fi" id="pay-amt" type="number" placeholder="0" min="0" inputmode="numeric" value="${bal}" oninput="updatePayPreview(${i.id})"></div>
    <div class="fg"><label class="fl">Note (optional)</label><input class="fi" id="pay-note" type="text" placeholder="e.g. half payment, balance Friday..."></div>
    <div id="pay-preview" style="margin-bottom:11px"></div>
    <button class="btn primary" onclick="recordPayment(${i.id},false)" style="margin-bottom:8px">Save payment</button>
    <button class="btn" id="settle-btn" onclick="recordPayment(${i.id},true)" style="display:none;margin-bottom:8px;border-color:var(--green);color:var(--green)">Save &amp; mark fully settled</button>`;
        document.getElementById("pay-mbg").classList.add("open");
        updatePayPreview(id);
      }
      function updatePayPreview(id) {
        const i = state.items.find((x) => x.id === id);
        if (!i) return;
        const amt = parseFloat(document.getElementById("pay-amt")?.value) || 0;
        const bal = balance(i);
        const nb = Math.max(0, bal - amt);
        const sb = document.getElementById("settle-btn");
        let html = "";
        if (amt > 0) {
          if (amt >= bal) {
            html = `<div class="bal-box clear"><span style="font-size:12px;font-weight:600;color:var(--green)">Fully paid ✓</span><span style="font-size:14px;font-weight:700;color:var(--green)">No balance</span></div>`;
            if (sb) sb.style.display = "none";
          } else {
            html = `<div class="bal-box"><span style="font-size:12px;font-weight:600;color:var(--red)">Remaining balance</span><span style="font-size:14px;font-weight:700;color:var(--red)">${fmt(nb)}</span></div>`;
            if (sb) sb.style.display = "";
          }
        }
        document.getElementById("pay-preview").innerHTML = html;
      }
      function recordPayment(id, settle) {
        const i = state.items.find((x) => x.id === id);
        if (!i) return;
        const amt = parseFloat(document.getElementById("pay-amt")?.value) || 0;
        const note = document.getElementById("pay-note")?.value.trim() || "";
        if (amt <= 0) {
          showToast("Enter the amount received");
          return;
        }
        if (!i.payments) i.payments = [];
        i.payments.push({ amount: amt, date: new Date().toISOString(), note });
        if (settle) i.settledShort = true;
        i.editedAt = new Date().toISOString();
        lsave();
        scheduleSync();
        closePayModal();
        closeModal();
        showToast(
          settle
            ? "✓ Record settled"
            : "✓ Payment of " + fmt(amt) + " recorded",
        );
        renderHome();
      }
      function closePayModal() {
        document.getElementById("pay-mbg").classList.remove("open");
      }

      function sendWhatsApp(phone, name, type, itemId) {
        let msg = "";
        const cp = phone.replace(/\D/g, "").replace(/^0/, "234");
        if (type === "debt" && itemId) {
          const item = state.items.find((x) => x.id === itemId);
          const bal = item ? balance(item) : 0;
          msg = `Hello ${name}, this is a reminder that you have an outstanding balance of ${fmt(bal)} for your fish drying service at Mummy J's Fish Store. Kindly settle at your earliest convenience. Thank you!`;
        } else if (type === "ready" && itemId) {
          const item = state.items.find((x) => x.id === itemId);
          const fish =
            (item?.fishRows || []).map((r) => r.type).join(", ") || "your fish";
          msg = `Hello ${name}, good news! ${fish} is ready for collection at Mummy J's Fish Store. Please come to collect. Thank you!`;
        } else if (type === "saledebt" && itemId) {
          const sale = state.shop.sales.find((x) => x.id === itemId);
          const owes = sale ? sale.amount - sale.amtPaid : 0;
          msg = `Hello ${name}, this is a reminder that you have an outstanding balance of ${fmt(owes)} for dry fish purchased from Mummy J's Fish Store. Kindly settle at your earliest convenience. Thank you!`;
        } else {
          msg = `Hello ${name}, please note you have an outstanding balance at Mummy J's Fish Store. Kindly come and settle. Thank you!`;
        }
        window.open(
          `https://wa.me/${cp}?text=${encodeURIComponent(msg)}`,
          "_blank",
        );
      }

      function showReceipt(id) {
        const item = state.items.find((x) => x.id === id);
        if (!item) return;
        const fishRows = item.fishRows || [
          {
            type: item.type,
            weight: item.weight,
            count: item.count,
            price: item.price,
            discount: item.discount,
            total: item.total,
          },
        ];
        const paid = totalPaid(item);
        const bal = balance(item);
        document.getElementById("receipt-body").innerHTML = `
    <button class="mclose" onclick="closeReceipt()">Close</button>
    <div class="mtitle">Receipt</div>
    <div id="receipt-card" style="background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr2);padding:20px;margin:12px 0">
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:22px;margin-bottom:4px">🐟</div>
        <div style="font-size:17px;font-weight:700;color:var(--t1)">Mummy J's Fish Store</div>
        <div style="font-size:11px;color:var(--t3);margin-top:2px">Fish Drying Service Receipt</div>
        <div style="height:1px;background:var(--bdr2);margin:12px 0"></div>
      </div>
      <div style="margin-bottom:12px">
        <div style="font-size:12px;color:var(--t3);margin-bottom:2px">Customer</div>
        <div style="font-size:16px;font-weight:700;color:var(--t1)">${item.name}</div>
        ${item.phone ? `<div style="font-size:12px;color:var(--t3)">${item.phone}</div>` : ""}
      </div>
      <div style="height:1px;background:var(--bdr);margin-bottom:12px"></div>
      <div style="margin-bottom:12px">
        <div style="font-size:12px;color:var(--t3);margin-bottom:6px">Fish details</div>
        ${fishRows.map((r) => `<div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px"><div><span style="font-weight:600">${r.type}</span><span style="color:var(--t3)"> ${r.weight ? r.weight + "kg" : ""} ${r.count ? "· " + r.count + " pcs" : ""}</span></div><div style="font-weight:600">${fmt(r.total)}</div></div>${r.discount ? `<div style="font-size:11px;color:var(--red);text-align:right">Discount: -${fmt(r.discount)}</div>` : ""}`).join("")}
      </div>
      <div style="height:1px;background:var(--bdr2);margin-bottom:12px"></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px"><span style="color:var(--t2)">Total charged</span><span style="font-weight:700;color:var(--teal);font-size:16px">${fmt(item.total)}</span></div>
      ${paid > 0 ? `<div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px"><span style="color:var(--t2)">Amount paid</span><span style="font-weight:600;color:var(--green)">${fmt(paid)}</span></div>` : ""}
      ${bal > 0 && !item.settledShort ? `<div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px"><span style="color:var(--t2)">Balance owing</span><span style="font-weight:700;color:var(--red)">${fmt(bal)}</span></div>` : ""}
      ${item.settledShort || bal <= 0 ? `<div style="text-align:center;background:var(--green-l);border-radius:var(--rsm);padding:6px;font-size:13px;font-weight:600;color:var(--green);margin-bottom:6px">✓ Fully paid</div>` : ""}
      <div style="height:1px;background:var(--bdr);margin:10px 0"></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3)">
        <span>Date in: ${shortDate(item.createdAt)}</span>
        ${item.collectedAt ? `<span>Collected: ${shortDate(item.collectedAt)}</span>` : ""}
      </div>
      ${item.notes ? `<div style="margin-top:8px;font-size:11px;color:var(--t3)">Note: ${item.notes}</div>` : ""}
      <div style="text-align:center;margin-top:14px;font-size:11px;color:var(--t3)">Thank you for your business! 🙏</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn primary" style="flex:1" onclick="shareReceipt(${id})"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>Share image</button>
      <button class="btn whatsapp" style="flex:1" onclick="whatsappReceipt(${id})"><svg viewBox="0 0 24 24" style="fill:none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>WhatsApp</button>
    </div>`;
        document.getElementById("receipt-mbg").classList.add("open");
      }
      function closeReceipt() {
        document.getElementById("receipt-mbg").classList.remove("open");
      }

      async function shareReceipt(id) {
        const item = state.items.find((x) => x.id === id);
        if (!item) return;
        showToast("Generating image...");
        try {
          const canvas = await buildReceiptCanvas(item);
          canvas.toBlob(async (blob) => {
            const file = new File(
              [blob],
              `receipt-${item.name}-${Date.now()}.png`,
              { type: "image/png" },
            );
            if (navigator.share && navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: `Receipt — ${item.name}`,
                text: "Fish drying receipt from Mummy J's Fish Store",
              });
            } else {
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = `receipt-${item.name}.png`;
              a.click();
              URL.revokeObjectURL(url);
              showToast("Receipt saved to downloads");
            }
          }, "image/png");
        } catch (e) {
          showToast("Could not share — try WhatsApp button");
        }
      }

      function whatsappReceipt(id) {
        const item = state.items.find((x) => x.id === id);
        if (!item) return;
        const fishRows = item.fishRows || [
          { type: item.type, weight: item.weight, total: item.total },
        ];
        const paid = totalPaid(item);
        const bal = balance(item);
        const cp = (item.phone || "").replace(/\D/g, "").replace(/^0/, "234");
        let msg = `🐟 *Mummy J's Fish Store*\n*Fish Drying Service Receipt*\n\n*Customer:* ${item.name}\n*Date in:* ${shortDate(item.createdAt)}\n`;
        if (item.collectedAt)
          msg += `*Collected:* ${shortDate(item.collectedAt)}\n`;
        msg += `\n*Fish details:*\n`;
        fishRows.forEach((r) => {
          msg += `• ${r.type}${r.weight ? " — " + r.weight + "kg" : ""}${r.count ? " / " + r.count + " pcs" : ""}: ${fmt(r.total)}\n`;
        });
        msg += `\n*Total charged:* ${fmt(item.total)}\n`;
        if (paid > 0) msg += `*Amount paid:* ${fmt(paid)}\n`;
        if (bal > 0 && !item.settledShort)
          msg += `*Balance owing:* ${fmt(bal)}\n`;
        if (item.settledShort || bal <= 0) msg += `*Status:* ✅ Fully paid\n`;
        msg += `\nThank you for your business! 🙏`;
        window.open(
          cp
            ? `https://wa.me/${cp}?text=${encodeURIComponent(msg)}`
            : `https://wa.me/?text=${encodeURIComponent(msg)}`,
          "_blank",
        );
      }

      async function buildReceiptCanvas(item) {
        const fishRows = item.fishRows || [
          {
            type: item.type,
            weight: item.weight,
            count: item.count,
            price: item.price,
            discount: item.discount,
            total: item.total,
          },
        ];
        const paid = totalPaid(item);
        const bal = balance(item);
        const W = 640,
          pad = 40;
        const H =
          480 +
          fishRows.length * 50 +
          (paid > 0 ? 30 : 0) +
          (item.notes ? 30 : 0);
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#1D9E75";
        ctx.fillRect(0, 0, W, 8);
        let y = 44;
        ctx.fillStyle = "#1D9E75";
        ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🐟 Mummy J's Fish Store", W / 2, y);
        y += 28;
        ctx.fillStyle = "#888";
        ctx.font = "15px sans-serif";
        ctx.fillText("Fish Drying Service Receipt", W / 2, y);
        y += 34;
        ctx.strokeStyle = "#e0e0e0";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(W - pad, y);
        ctx.stroke();
        y += 20;
        ctx.fillStyle = "#888";
        ctx.font = "13px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("CUSTOMER", pad, y);
        y += 20;
        ctx.fillStyle = "#1a1a1a";
        ctx.font = "bold 19px sans-serif";
        ctx.fillText(item.name, pad, y);
        y += 22;
        if (item.phone) {
          ctx.fillStyle = "#888";
          ctx.font = "13px sans-serif";
          ctx.fillText(item.phone, pad, y);
          y += 20;
        }
        y += 8;
        ctx.strokeStyle = "#e0e0e0";
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(W - pad, y);
        ctx.stroke();
        y += 18;
        ctx.fillStyle = "#888";
        ctx.font = "13px sans-serif";
        ctx.fillText("FISH DETAILS", pad, y);
        y += 20;
        fishRows.forEach((r) => {
          ctx.fillStyle = "#1a1a1a";
          ctx.font = "bold 14px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText(r.type, pad, y);
          ctx.textAlign = "right";
          ctx.fillText(fmt(r.total), W - pad, y);
          ctx.textAlign = "left";
          y += 20;
          if (r.weight || r.count) {
            ctx.fillStyle = "#888";
            ctx.font = "12px sans-serif";
            ctx.fillText(
              `${r.weight ? r.weight + "kg" : ""} ${r.count ? "· " + r.count + " pcs" : ""}`.trim(),
              pad + 10,
              y,
            );
            y += 18;
          }
          if (r.discount) {
            ctx.fillStyle = "#E24B4A";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(`Discount: -${fmt(r.discount)}`, W - pad, y);
            ctx.textAlign = "left";
            y += 18;
          }
        });
        y += 6;
        ctx.strokeStyle = "#1D9E75";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(W - pad, y);
        ctx.stroke();
        ctx.lineWidth = 1;
        y += 18;
        ctx.fillStyle = "#555";
        ctx.font = "14px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("Total charged", pad, y);
        ctx.fillStyle = "#1D9E75";
        ctx.font = "bold 19px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(fmt(item.total), W - pad, y);
        ctx.textAlign = "left";
        y += 28;
        if (paid > 0) {
          ctx.fillStyle = "#555";
          ctx.font = "14px sans-serif";
          ctx.fillText("Amount paid", pad, y);
          ctx.fillStyle = "#3B6D11";
          ctx.font = "bold 15px sans-serif";
          ctx.textAlign = "right";
          ctx.fillText(fmt(paid), W - pad, y);
          ctx.textAlign = "left";
          y += 26;
        }
        if (bal > 0 && !item.settledShort) {
          ctx.fillStyle = "#555";
          ctx.font = "14px sans-serif";
          ctx.fillText("Balance owing", pad, y);
          ctx.fillStyle = "#E24B4A";
          ctx.font = "bold 15px sans-serif";
          ctx.textAlign = "right";
          ctx.fillText(fmt(bal), W - pad, y);
          ctx.textAlign = "left";
          y += 26;
        }
        if (item.settledShort || bal <= 0) {
          ctx.fillStyle = "#EAF3DE";
          ctx.fillRect(pad, y - 18, W - pad * 2, 30);
          ctx.fillStyle = "#3B6D11";
          ctx.font = "bold 14px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("✓ Fully paid", W / 2, y);
          ctx.textAlign = "left";
          y += 20;
        }
        y += 8;
        ctx.strokeStyle = "#e0e0e0";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(W - pad, y);
        ctx.stroke();
        y += 16;
        ctx.fillStyle = "#888";
        ctx.font = "12px sans-serif";
        ctx.fillText(`Date in: ${shortDate(item.createdAt)}`, pad, y);
        if (item.collectedAt) {
          ctx.textAlign = "right";
          ctx.fillText(`Collected: ${shortDate(item.collectedAt)}`, W - pad, y);
          ctx.textAlign = "left";
        }
        y += 22;
        if (item.notes) {
          ctx.fillStyle = "#888";
          ctx.font = "12px sans-serif";
          ctx.fillText(`Note: ${item.notes}`, pad, y);
          y += 20;
        }
        y += 8;
        ctx.fillStyle = "#1D9E75";
        ctx.font = "italic 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Thank you for your business! 🙏", W / 2, y);
        ctx.fillStyle = "#1D9E75";
        ctx.fillRect(0, H - 8, W, 8);
        return canvas;
      }

      function showAcknowledgement(id) {
        const item = state.items.find((x) => x.id === id);
        if (!item) return;
        const fishRows = item.fishRows || [
          {
            type: item.type,
            weight: item.weight,
            count: item.count,
            price: item.price,
            discount: item.discount,
            total: item.total,
          },
        ];
        document.getElementById("receipt-body").innerHTML = `
    <button class="mclose" onclick="closeReceipt()">Close</button>
    <div class="mtitle">Acknowledgement</div>
    <div id="ack-card" style="background:var(--surf);border-radius:var(--r);border:1px solid var(--bdr2);padding:20px;margin:12px 0">
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:22px;margin-bottom:4px">🐟</div>
        <div style="font-size:17px;font-weight:700;color:var(--t1)">Mummy J's Fish Store</div>
        <div style="font-size:11px;color:var(--t3);margin-top:2px">${getServiceType(item)} — Acknowledgement Slip</div>
        <div style="height:1px;background:var(--bdr2);margin:12px 0"></div>
      </div>
      <div style="margin-bottom:12px">
        <div style="font-size:12px;color:var(--t3);margin-bottom:2px">Customer</div>
        <div style="font-size:16px;font-weight:700;color:var(--t1)">${item.name}</div>
        ${item.phone ? `<div style="font-size:12px;color:var(--t3)">${item.phone}</div>` : ""}
      </div>
      <div style="height:1px;background:var(--bdr);margin-bottom:12px"></div>
      <div style="margin-bottom:12px">
        <div style="font-size:12px;color:var(--t3);margin-bottom:6px">Product received</div>
        ${fishRows
          .map(
            (r) => `
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
            <div>
              <span style="font-weight:600">${r.type}</span>
              ${r.weight ? `<span style="background:var(--teal-l);color:var(--teal-d);font-size:11px;font-weight:600;padding:1px 6px;border-radius:10px;margin-left:4px">${r.weight}kg</span>` : ""}
              ${r.count ? `<span style="background:var(--blue-l);color:var(--blue);font-size:11px;font-weight:600;padding:1px 6px;border-radius:10px;margin-left:4px">${r.count} pcs</span>` : ""}
            </div>
            <div style="font-weight:600">${fmt(r.total)}</div>
          </div>
          ${r.discount ? `<div style="font-size:11px;color:var(--red);text-align:right">Discount: -${fmt(r.discount)}</div>` : ""}`,
          )
          .join("")}
      </div>
      <div style="height:1px;background:var(--bdr2);margin-bottom:12px"></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px">
        <span style="color:var(--t2)">Total</span>
        <span style="font-weight:700;color:var(--teal);font-size:16px">${fmt(item.total)}</span>
      </div>
      <div style="height:1px;background:var(--bdr);margin:10px 0"></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-bottom:10px">
        <span>Date received: ${shortDate(item.createdAt)}</span>
        <span><span class="pill ${item.status}">${statusLabel(item.status)}</span></span>
      </div>
      ${item.notes ? `<div style="font-size:11px;color:var(--t3);margin-bottom:10px">Note: ${item.notes}</div>` : ""}
      <div style="background:var(--teal-l);border-radius:var(--rsm);padding:10px 12px;font-size:12px;color:var(--teal-d);line-height:1.6;margin-bottom:10px">
        Your fish has been received and is currently being processed. You will be notified when it is ready for collection. Payment is due upon collection.
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn primary" style="flex:1" onclick="shareAcknowledgement(${id})">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        Share image
      </button>
      <button class="btn whatsapp" style="flex:1" onclick="whatsappAcknowledgement(${id})">
        <svg viewBox="0 0 24 24" style="fill:none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        WhatsApp
      </button>
    </div>`;
        document.getElementById("receipt-mbg").classList.add("open");
      }

      function whatsappAcknowledgement(id) {
        const item = state.items.find((x) => x.id === id);
        if (!item) return;
        const fishRows = item.fishRows || [
          { type: item.type, weight: item.weight, total: item.total },
        ];
        const cp = (item.phone || "").replace(/\D/g, "").replace(/^0/, "234");
        let msg = `🐟 *Mummy J's Fish Store*\n*Fish Drying — Acknowledgement*\n\n`;
        msg += `*Customer:* ${item.name}\n`;
        msg += `*Date received:* ${shortDate(item.createdAt)}\n\n`;
        msg += `*Fish received:*\n`;
        fishRows.forEach((r) => {
          msg += `• ${r.type}${r.weight ? " — " + r.weight + "kg" : ""}${r.count ? " / " + r.count + " pcs" : ""}: ${fmt(r.total)}\n`;
        });
        msg += `\n*Total agreed:* ${fmt(item.total)}\n\n`;
        msg += `Your fish has been received and is currently being processed. You will be notified when ready for collection. Payment is due upon collection.\n\n`;
        msg += `_Received by: ${item.addedBy || "Mummy J's Fish Store"}_`;
        window.open(
          cp
            ? `https://wa.me/${cp}?text=${encodeURIComponent(msg)}`
            : `https://wa.me/?text=${encodeURIComponent(msg)}`,
          "_blank",
        );
      }

      async function shareAcknowledgement(id) {
        const item = state.items.find((x) => x.id === id);
        if (!item) return;
        showToast("Generating image...");
        try {
          const canvas = await buildAcknowledgementCanvas(item);
          canvas.toBlob(async (blob) => {
            const file = new File(
              [blob],
              `ack-${item.name}-${Date.now()}.png`,
              { type: "image/png" },
            );
            if (navigator.share && navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: `Acknowledgement — ${item.name}`,
                text: "Fish drying acknowledgement",
              });
            } else {
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = `ack-${item.name}.png`;
              a.click();
              URL.revokeObjectURL(url);
              showToast("Saved to downloads");
            }
          }, "image/png");
        } catch (e) {
          showToast("Could not share — try WhatsApp button");
        }
      }

      async function buildAcknowledgementCanvas(item) {
        const fishRows = item.fishRows || [
          {
            type: item.type,
            weight: item.weight,
            count: item.count,
            price: item.price,
            discount: item.discount,
            total: item.total,
          },
        ];
        const W = 640,
          pad = 40;
        const H = 520 + fishRows.length * 50 + (item.notes ? 30 : 0);
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#1D9E75";
        ctx.fillRect(0, 0, W, 8);
        let y = 44;
        ctx.fillStyle = "#1D9E75";
        ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🐟 Mummy J's Fish Store", W / 2, y);
        y += 28;
        ctx.fillStyle = "#888";
        ctx.font = "15px sans-serif";
        ctx.fillText(
          getServiceType(item) + " — Acknowledgement Slip",
          W / 2,
          y,
        );
        y += 34;
        ctx.strokeStyle = "#e0e0e0";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(W - pad, y);
        ctx.stroke();
        y += 20;
        ctx.fillStyle = "#888";
        ctx.font = "13px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("CUSTOMER", pad, y);
        y += 20;
        ctx.fillStyle = "#1a1a1a";
        ctx.font = "bold 19px sans-serif";
        ctx.fillText(item.name, pad, y);
        y += 22;
        if (item.phone) {
          ctx.fillStyle = "#888";
          ctx.font = "13px sans-serif";
          ctx.fillText(item.phone, pad, y);
          y += 20;
        }
        y += 8;
        ctx.strokeStyle = "#e0e0e0";
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(W - pad, y);
        ctx.stroke();
        y += 18;
        ctx.fillStyle = "#888";
        ctx.font = "13px sans-serif";
        ctx.fillText("ITEMS RECEIVED", pad, y);
        y += 20;
        fishRows.forEach((r) => {
          ctx.fillStyle = "#1a1a1a";
          ctx.font = "bold 14px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText(r.type, pad, y);
          ctx.textAlign = "right";
          ctx.fillText(fmt(r.total), W - pad, y);
          ctx.textAlign = "left";
          y += 20;
          if (r.weight || r.count) {
            ctx.fillStyle = "#1D9E75";
            ctx.font = "bold 12px sans-serif";
            ctx.fillText(
              `${r.weight ? r.weight + "kg" : ""} ${r.count ? "· " + r.count + " pcs" : ""}`.trim(),
              pad + 10,
              y,
            );
            y += 18;
          }
          if (r.discount) {
            ctx.fillStyle = "#E24B4A";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(`Discount: -${fmt(r.discount)}`, W - pad, y);
            ctx.textAlign = "left";
            y += 18;
          }
        });
        y += 6;
        ctx.strokeStyle = "#1D9E75";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(W - pad, y);
        ctx.stroke();
        ctx.lineWidth = 1;
        y += 18;
        ctx.fillStyle = "#555";
        ctx.font = "14px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("Total agreed", pad, y);
        ctx.fillStyle = "#1D9E75";
        ctx.font = "bold 19px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(fmt(item.total), W - pad, y);
        ctx.textAlign = "left";
        y += 28;
        ctx.strokeStyle = "#e0e0e0";
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(W - pad, y);
        ctx.stroke();
        y += 16;
        ctx.fillStyle = "#888";
        ctx.font = "12px sans-serif";
        ctx.fillText(`Date received: ${shortDate(item.createdAt)}`, pad, y);
        ctx.textAlign = "right";
        ctx.fillText(`Status: ${statusLabel(item.status)}`, W - pad, y);
        ctx.textAlign = "left";
        y += 22;
        if (item.notes) {
          ctx.fillStyle = "#888";
          ctx.font = "12px sans-serif";
          ctx.fillText(`Note: ${item.notes}`, pad, y);
          y += 20;
        }
        // teal notice box
        y += 6;
        ctx.fillStyle = "#E1F5EE";
        ctx.fillRect(pad, y, W - pad * 2, 56);
        ctx.fillStyle = "#085041";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
          "Your fish has been received and is being processed.",
          W / 2,
          y + 18,
        );
        ctx.fillText(
          "You will be notified when ready for collection.",
          W / 2,
          y + 34,
        );
        ctx.fillText("Payment is due upon collection.", W / 2, y + 50);
        ctx.textAlign = "left";
        y += 70;
        ctx.fillStyle = "#888";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(
          `Received by: ${item.addedBy || "Mummy J's Fish Store"}`,
          W - pad,
          y,
        );
        ctx.fillStyle = "#1D9E75";
        ctx.fillRect(0, H - 8, W, 8);
        return canvas;
      }

      function getServiceType(item) {
        const fishRows = item.fishRows || [{ type: item.type }];
        const types = fishRows.map((r) => (r.type || "").toLowerCase());
        const hasMeat = types.some(
          (t) =>
            t.includes("meat") ||
            t.includes("beef") ||
            t.includes("chicken") ||
            t.includes("goat") ||
            t.includes("turkey") ||
            t.includes("pork"),
        );
        const hasFish = types.some(
          (t) =>
            !t.includes("meat") &&
            !t.includes("beef") &&
            !t.includes("chicken") &&
            !t.includes("goat") &&
            !t.includes("turkey") &&
            !t.includes("pork"),
        );
        if (hasMeat && hasFish) return "Drying Service";
        if (hasMeat) return "Meat Drying";
        return "Fish Drying";
      }

      function callCustomer(phone, name) {
        showToast("Calling " + name + "...");
        setTimeout(() => {
          window.location.href = "tel:" + phone;
        }, 300);
      }
      function handleMBGClick(e) {
        if (e.target === document.getElementById("modal-bg")) closeModal();
      }
      function closeModal() {
        document.getElementById("modal-bg").classList.remove("open");
      }
      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(t._t);
        t._t = setTimeout(() => t.classList.remove("show"), 2800);
      }

      let newWorker;
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          reg.addEventListener("updatefound", () => {
            newWorker = reg.installing;
            newWorker.addEventListener("statechange", () => {
              if (
                newWorker.state === "installed" &&
                navigator.serviceWorker.controller
              )
                document.getElementById("update-banner").classList.add("show");
            });
          });
        });
        navigator.serviceWorker.addEventListener("controllerchange", () =>
          window.location.reload(),
        );
      }
      function applyUpdate() {
        if (newWorker) newWorker.postMessage("skipWaiting");
      }

      function confirmClearAll() {
        document.getElementById("cfm-title").textContent = "Clear all records?";
        document.getElementById("cfm-msg").textContent =
          "This will permanently delete ALL drying service records, purchases, sales and expenses. This cannot be undone. Are you absolutely sure?";
        document.getElementById("cfm-ok").textContent = "Yes, clear everything";
        document.getElementById("cfm-ok").onclick = () => {
          state.items = [];
          state.nextId = 1;
          state.shop.purchases = [];
          state.shop.sales = [];
          state.shop.expenses = [];
          state.shop.purNextId = 1;
          state.shop.saleNextId = 1;
          state.shop.expNextId = 1;
          state.shop.dryStockKg = 0;
          lsave();
          scheduleSync();
          closeCfm();
          showScreen("home");
          showToast("All records cleared");
        };
        document.getElementById("cfm").classList.add("open");
      }

      initApp();
    </script>
  </body>
</html>
